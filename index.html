<!doctype html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>PBD Tracker</title>
  <meta name="description" content="Sistem Perekodan Pentaksiran Bilik Darjah (PBD) - Tajuk, Standard Kandungan, Standard Pembelajaran, TP, Lampiran & Justifikasi, dengan auto-simpan dan sinkron Google Sheets." />
  <meta name="theme-color" content="#EC7FAE" />

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>

  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    html, body, #root { height: 100%; }

      window.addEventListener("load", () => {

      });
