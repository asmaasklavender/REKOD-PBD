<!doctype html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>PBD Tracker</title>
  <meta name="description" content="Sistem Perekodan Pentaksiran Bilik Darjah (PBD) - modular untuk pelbagai subjek sekolah rendah, dengan sinkron Google Sheets." />
  <meta name="theme-color" content="#3E6FA6" />

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="PBD Tracker" />

  <!-- Tailwind (CDN, tiada compiler - hanya utiliti teras) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React 18 + Babel standalone (membolehkan JSX terus di pelayar tanpa proses 'build') -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Google Identity Services - diperlukan untuk ciri "Sambungan Google Sheets" -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    html, body, #root { height: 100%; }
    body { margin: 0; background: #FAF8F4; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module" src="app.js"></script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("service-worker.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
